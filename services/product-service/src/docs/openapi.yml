openapi: 3.0.3

info:
  title: SmartRetailX Product Catalogue API
  description: |
    Product and category management for SmartRetailX.

    **Image handling.** Product images are stored in S3 and returned as
    time-limited signed URLs (`imageUrl`). The S3 key is opaque to the client;
    sending that URL back to the API has no effect.

    **Events.** Creating a product publishes a `ProductCreated` event. The
    inventory-service consumes it and, if `initialStock > 0` is provided,
    creates an inventory record in the specified warehouse (or the first
    active warehouse if `warehouseId` is omitted).

    **Authentication.** All product and category endpoints are **public**.
    Write operations are expected to be restricted at the API gateway layer
    in production, but there is no auth check in the service itself.

    **Response envelope.** Success → `{ "data": ... }`. Errors → `{ "error": "..." }`.
  version: 1.1.0
  contact:
    name: SmartRetailX
    url: https://github.com/smartretailx

servers:
  - url: http://localhost:3002
    description: Local development server

tags:
  - name: Products
    description: Product catalogue operations
  - name: Categories
    description: Product category management

paths:

  # ---------------------------------------------------------------------------
  # Products
  # ---------------------------------------------------------------------------

  /api/v1/products:
    get:
      tags: [Products]
      summary: List all products
      description: |
        Returns every product, sorted by `createdAt` descending.
        Each product's `imageUrl` is a **signed S3 URL** valid for 1 hour.
      operationId: getProducts
      responses:
        "200":
          description: Products retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
              example:
                data:
                  - productId: P1788767406608
                    name: Buldak Ramen
                    categoryId: CAT1788767400000
                    description: Korean spicy instant noodles
                    price: 627
                    currency: GBP
                    imageUrl: https://smartretailx-products.s3.ap-south-1.amazonaws.com/products/1788767406608/1788767406608.jpg?X-Amz-Algorithm=...
                    status: ACTIVE
                    createdAt: "2026-09-21T10:00:00.000Z"
                    updatedAt: "2026-09-21T10:00:00.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Products]
      summary: Create a new product
      description: |
        Creates a product and, on success, publishes a `ProductCreated` event
        with retry (3 attempts, exponential backoff). Downstream, the
        inventory-service will create a stock record if `initialStock > 0`.

        **Content type:** `multipart/form-data`. The `image` field is optional;
        if omitted, `imageUrl` will be `null`.

        **Note on `currency`:** the service defaults to `LKR` if not provided.
        Clients should send an explicit value (e.g. `GBP`) if a different
        currency is desired.
      operationId: createProduct
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp, image/gif
      responses:
        "201":
          description: Product created and `ProductCreated` published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: |
            Validation failed — missing required fields, unknown category,
            negative price, or invalid status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingFields:
                  value: { error: "name, categoryId, description and price are required" }
                unknownCategory:
                  value: { error: "Category does not exist" }
                badPrice:
                  value: { error: "price must be a non-negative number" }
                badStatus:
                  value: { error: "status must be ACTIVE or INACTIVE" }
        "409":
          description: A product with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: A product with this name already exists
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{productId}:
    get:
      tags: [Products]
      summary: Get a product by ID
      operationId: getProductById
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Products]
      summary: Update a product
      description: |
        Partial update — send only the fields you want to change.

        **Image replacement logic:**
        - If a new `image` file is uploaded, the old S3 object is deleted and
          the new one becomes the product's image.
        - If `removeImage=true` is sent, the image is deleted and `imageUrl`
          becomes `null`.
        - If neither is sent, the existing image is preserved.

        **Content type:** `multipart/form-data` (even for text-only updates,
        because multer is mounted as middleware).
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp, image/gif
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: |
            Invalid field value or no fields provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyString:
                  value: { error: "name must be a non-empty string" }
                noFields:
                  value: { error: "No valid fields provided for update" }
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: A different product already uses the requested name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: A product with this name already exists
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Products]
      summary: Delete a product
      description: |
        Deletes the product and, if it had an image, removes the S3 object.
        S3 deletion failures are logged but do not block the product deletion.
      operationId: deleteProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted (no body)
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Categories
  # ---------------------------------------------------------------------------

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List all categories
      operationId: getCategories
      responses:
        "200":
          description: Categories retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
              example:
                data:
                  - categoryId: CAT1788767400000
                    name: Beverages
                    description: Soft drinks, juices and water
                    createdAt: "2026-09-20T10:00:00.000Z"
                    updatedAt: "2026-09-20T10:00:00.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Categories]
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
            example:
              name: Beverages
              description: Soft drinks, juices and water
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "400":
          description: name is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: name is required
        "409":
          description: Category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Category with this name already exists
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get a category by ID
      operationId: getCategoryById
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Category retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Categories]
      summary: Update a category
      description: |
        Partial update — send only the fields you want to change. At least
        one field must be present.
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
            example:
              description: Cold and hot beverages
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "400":
          description: Invalid field value or no fields provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                empty:
                  value: { error: "name must be a non-empty string" }
                noFields:
                  value: { error: "No fields to update" }
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          description: Another category already uses this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Category with this name already exists
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Categories]
      summary: Delete a category
      description: |
        Refuses to delete a category that is still referenced by one or more
        products (returns `409`).
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Category deleted (no body)
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          description: Cannot delete — category is used by one or more products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Cannot delete category because it is used by one or more products
        "500":
          $ref: "#/components/responses/InternalError"

# -----------------------------------------------------------------------------
# Reusable components
# -----------------------------------------------------------------------------
components:

  parameters:

    ProductId:
      name: productId
      in: path
      required: true
      description: Product identifier
      schema:
        type: string
      example: P1788767406608

    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category identifier
      schema:
        type: string
      example: CAT1788767400000

  responses:

    ProductNotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Product not found

    CategoryNotFound:
      description: Category not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Category not found

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Internal server error

  schemas:

    # -------------------------------------------------------------------------
    # Response objects
    # -------------------------------------------------------------------------

    Product:
      type: object
      description: |
        A product in the catalogue. `imageUrl` is a signed S3 URL valid for
        1 hour; if the product has no image, `imageUrl` is `null`.
      properties:
        productId:
          type: string
          example: P1788767406608
        name:
          type: string
          example: Buldak Ramen
        categoryId:
          type: string
          example: CAT1788767400000
        description:
          type: string
          example: Korean spicy instant noodles
        price:
          type: number
          format: double
          minimum: 0
          example: 627
        currency:
          type: string
          description: ISO 4217 currency code
          example: GBP
        imageUrl:
          type: string
          nullable: true
          description: Signed S3 URL (or `null` if no image uploaded)
          example: https://smartretailx-products.s3.ap-south-1.amazonaws.com/products/...
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      description: A product category.
      properties:
        categoryId:
          type: string
          example: CAT1788767400000
        name:
          type: string
          example: Beverages
        description:
          type: string
          example: Soft drinks, juices and water
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Request bodies
    # -------------------------------------------------------------------------

    CreateProductRequest:
      type: object
      required:
        - name
        - categoryId
        - description
        - price
      properties:
        name:
          type: string
          example: Buldak Ramen
        categoryId:
          type: string
          example: CAT1788767400000
        description:
          type: string
          example: Korean spicy instant noodles
        price:
          type: number
          format: double
          minimum: 0
          example: 627
        currency:
          type: string
          default: LKR
          description: |
            ISO 4217 currency code. **Defaults to `LKR`** if not provided —
            clients should send an explicit value.
          example: GBP
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        image:
          type: string
          format: binary
          description: Optional product image file
        initialStock:
          type: integer
          minimum: 0
          default: 0
          description: |
            Initial stock quantity. If greater than 0, the inventory-service
            will create a stock record after the `ProductCreated` event.
          example: 50
        warehouseId:
          type: string
          description: |
            Warehouse to stock the product in. If omitted, the
            inventory-service picks the first active warehouse.
          example: WH01

    UpdateProductRequest:
      type: object
      description: |
        Partial update. All fields are optional. If no fields are provided,
        the API returns `400 No valid fields provided for update`.
      properties:
        name:
          type: string
          minLength: 1
        categoryId:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        price:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          minLength: 1
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        image:
          type: string
          format: binary
          description: New image; if sent, replaces the old image
        removeImage:
          type: string
          description: |
            Set to `"true"` or `"1"` to delete the current image without
            replacing it. (Multipart form fields arrive as strings.)
          example: "true"

    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: Beverages
        description:
          type: string
          example: Soft drinks, juices and water

    UpdateCategoryRequest:
      type: object
      description: |
        Partial update. At least one of `name` or `description` must be
        present, otherwise the API returns `400 No fields to update`.
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    # -------------------------------------------------------------------------
    # Error
    # -------------------------------------------------------------------------

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Product not found