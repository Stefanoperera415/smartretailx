openapi: 3.0.3

info:
  title: SmartRetailX Product Catalogue API
  description: Product catalogue management API for SmartRetailX.
  version: 1.0.0

servers:
  - url: http://localhost:3002
    description: Local development server

tags:
  - name: Products
    description: Product catalogue operations

paths:

  /api/v1/products:

    get:
      tags:
        - Products
      summary: Get all products
      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"

    post:
      tags:
        - Products
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"

      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"

        "400":
          description: Invalid request

        "409":
          description: Product already exists


  /api/v1/products/{productId}:

    parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier
        schema:
          type: string
        example: P001

    get:
      tags:
        - Products
      summary: Get product by ID
      responses:
        "200":
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"

        "404":
          description: Product not found

    put:
      tags:
        - Products
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"

      responses:
        "200":
          description: Product updated successfully

        "400":
          description: Invalid request

        "404":
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete a product

      responses:
        "204":
          description: Product deleted successfully

        "404":
          description: Product not found


components:

  schemas:

    Product:
      type: object
      required:
        - productId
        - name
        - categoryId
        - description
        - price
        - currency
        - status

      properties:

        productId:
          type: string
          example: P001

        name:
          type: string
          example: Organic Milk

        categoryId:
          type: string
          example: CAT001

        description:
          type: string
          example: 1 litre organic whole milk

        price:
          type: number
          format: double
          minimum: 0
          example: 2.99

        currency:
          type: string
          example: GBP

        imageUrl:
          type: string
          nullable: true
          example: https://example.com/products/P001.jpg

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time


    CreateProductRequest:
      type: object
      required:
        - name
        - categoryId
        - description
        - price

      properties:

        name:
          type: string
          example: Organic Milk

        categoryId:
          type: string
          example: CAT001

        description:
          type: string
          example: 1 litre organic whole milk

        price:
          type: number
          format: double
          minimum: 0
          example: 2.99

        currency:
          type: string
          default: GBP
          example: GBP

        imageUrl:
          type: string
          nullable: true
          example: https://example.com/products/P001.jpg

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          default: ACTIVE


    UpdateProductRequest:
      type: object

      properties:

        name:
          type: string

        categoryId:
          type: string

        description:
          type: string

        price:
          type: number
          format: double
          minimum: 0

        currency:
          type: string

        imageUrl:
          type: string
          nullable: true

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE