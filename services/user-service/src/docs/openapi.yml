openapi: 3.0.3

info:
  title: SmartRetailX User Management API
  description: API for managing SmartRetailX customer and user profiles.
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: Local development server

tags:
  - name: Users
    description: User management operations

paths:

  /api/v1/users:

    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'

      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

        '400':
          description: Invalid request

        '409':
          description: User already exists


  /api/v1/users/{userId}:

    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
        example: U001

    get:
      tags:
        - Users
      summary: Get a user by ID
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'

      responses:
        '200':
          description: User updated successfully

        '404':
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete a user
      responses:
        '204':
          description: User deleted successfully

        '404':
          description: User not found


components:

  schemas:

    User:
      type: object
      properties:
        id:
          type: string
          example: U001

        email:
          type: string
          format: email
          example: test@example.com

        firstName:
          type: string
          example: John

        lastName:
          type: string
          example: Smith

        role:
          type: string
          enum:
            - CUSTOMER
            - STAFF
            - ADMIN
          example: CUSTOMER

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE


    CreateUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName

      properties:
        email:
          type: string
          format: email
          example: john@example.com

        firstName:
          type: string
          example: John

        lastName:
          type: string
          example: Smith

        role:
          type: string
          enum:
            - CUSTOMER
            - STAFF
            - ADMIN
          default: CUSTOMER


    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email

        firstName:
          type: string

        lastName:
          type: string

        role:
          type: string
          enum:
            - CUSTOMER
            - STAFF
            - ADMIN

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE