openapi: 3.0.3

info:
  title: SmartRetailX User Management API
  description: API for managing SmartRetailX customer and user profiles.
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: Local development server

tags:
  - name: Users
    description: User management operations
  - name: Authentication
    description: Login and registration

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new customer (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                  example: customer@example.com
                password:
                  type: string
                  format: password
                  example: "secure123"
                firstName:
                  type: string
                  example: Jane
                lastName:
                  type: string
                  example: Doe
                phone:
                  type: string
                  example: "+1234567890"
      responses:
        '201':
          description: Customer registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing required fields
        '409':
          description: User already exists

  /auth/register-admin:
    post:
      tags:
        - Authentication
      summary: Register a new ADMIN user (requires ADMIN token)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                  example: admin2@example.com
                password:
                  type: string
                  format: password
                  example: "secure456"
                firstName:
                  type: string
                  example: Admin
                lastName:
                  type: string
                  example: Two
                phone:
                  type: string
                  example: "+1234567890"
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing required fields
        '401':
          description: Unauthorized (missing or invalid token)
        '403':
          description: Forbidden (token does not have ADMIN role)
        '409':
          description: User already exists

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login and obtain JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: "secret123"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token to be used in Bearer authentication
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Missing email or password
        '401':
          description: Invalid credentials

  /api/v1/users:
    get:
      tags:
        - Users
      summary: Get all users (ADMIN and STAFF only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized (missing or invalid token)
        '403':
          description: Forbidden (CUSTOMER cannot list all users)

    post:
      tags:
        - Users
      summary: Create a new user (ADMIN only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request (missing required fields)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (only ADMIN can create)
        '409':
          description: User already exists

  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
        example: U001
        description: The unique identifier of the user

    get:
      tags:
        - Users
      summary: Get a user by ID (CUSTOMER can only view own profile)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (CUSTOMER trying to view other user)
        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update a user (CUSTOMER can update own profile; STAFF can update any except role; ADMIN can update anything)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (attempting to change role without ADMIN rights)
        '404':
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete a user (ADMIN only)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (only ADMIN can delete)
        '404':
          description: User not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: U001
        email:
          type: string
          format: email
          example: test@example.com
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Smith
        phone:
          type: string
          example: "+1234567890"
        role:
          type: string
          enum: [CUSTOMER, STAFF, ADMIN]
          example: CUSTOMER
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          example: "2026-05-10T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-10T12:00:00Z"

    CreateUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Smith
        phone:
          type: string
          example: "+1234567890"
        role:
          type: string
          enum: [CUSTOMER, STAFF, ADMIN]
          default: CUSTOMER
        password:
          type: string
          format: password
          example: "securePass123"

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        phone:
          type: string
          example: "+1234567890"
        role:
          type: string
          enum: [CUSTOMER, STAFF, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        password:
          type: string
          format: password
          example: "newSecurePass123"