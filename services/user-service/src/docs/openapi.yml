openapi: 3.0.3

info:
  title: SmartRetailX User Management API
  description: |
    User profile and admin-role management for SmartRetailX.

    **Authentication is handled by AWS Cognito**, not by this service.
    Clients obtain an ID token from the Cognito Hosted UI and send it as
    `Authorization: Bearer <token>`. This service **verifies** the token but
    never issues or stores credentials.

    **Password columns** in the `users` table contain the placeholder
    `"COGNITO_MANAGED"` — Cognito owns all credential storage.

    **JIT provisioning.** The first time an authenticated user calls
    `GET /auth/me`, this service creates a matching row in its `users` table
    from the Cognito claims (sub, email, given_name, family_name, phone).
    Subsequent calls return the stored profile.

    **Role derivation.** Roles are inferred from the Cognito `cognito:groups`
    claim. Precedence: `ADMIN` > `STAFF` > `CUSTOMER`.

    **Internal service calls.** A shared-secret header (`x-internal-key`)
    is accepted so that other services (order, notification) can look up
    user email addresses without holding a Cognito token. See `GET /{id}`
    for details.

    **Response envelope.** Success → `{ "data": ... }` or `{ "message": ... }`.
    Errors → `{ "error": "..." }`.
  version: 1.1.0
  contact:
    name: SmartRetailX
    url: https://github.com/smartretailx

servers:
  - url: http://localhost:3001
    description: Local development server

tags:
