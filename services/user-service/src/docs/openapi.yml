paths:

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user's profile
      description: |
        Returns the profile of the user identified by the bearer token.

        **On first call** (JIT provisioning): if the user's `sub` has no row
        in the `users` table, one is created automatically using the Cognito
        claims. This is how new registrations get into the local database —
        the frontend calls this endpoint on every login.

        **Typical frontend usage:**
        ```js
        const res = await fetch("/auth/me", {
          headers: { Authorization: `Bearer ${idToken}` }
        });
        const { data: profile } = await res.json();