openapi: 3.0.3

info:
  title: SmartRetailX Notification API
  description: |
    Notification management API for SmartRetailX.

    Provides CRUD operations for customer notifications, plus a live
    Server-Sent Events (SSE) stream so the frontend can update the
    notification badge in real time.

    All successful responses are wrapped as `{ "data": ... }` unless noted.
    All error responses are wrapped as `{ "error": "..." }`.
  version: 1.1.0
  contact:
    name: SmartRetailX
    url: https://github.com/smartretailx

servers:
  - url: http://localhost:3006
    description: Local development server

tags:
  - name: Notifications
    description: Notification management operations
  - name: Stream
    description: Server-Sent Events (SSE) live notifications

paths:
  # ---------------------------------------------------------------------------
  # Collection
  # ---------------------------------------------------------------------------

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: |
        Returns notifications ordered by `createdAt` descending.

        - Pass `customerId` to fetch a single customer's inbox.
        - Pass `status` to filter by status.
        - Pass neither to fetch everything (admin/debug use).
      operationId: getNotifications
      parameters:
        - name: customerId
          in: query
          required: false
          description: Cognito sub of the recipient
          schema:
            type: string
          example: 3153cd9a-e0e1-7052-ad0c-0af989d0ff51

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, SENT, READ]
          example: PENDING

      responses:
        "200":
          description: Notifications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
              example:
                data:
                  - notificationId: NOTIF1790003080488-xbixql
                    eventId: evt-1790003080488-xbixql
                    customerId: 3153cd9a-e0e1-7052-ad0c-0af989d0ff51
                    type: PAYMENT_COMPLETED
                    channel: EMAIL
                    message: Payment of 627 GBP for order ORD1790003079887 was successful. Your "Buldak Ramen" will be delivered shortly.
                    status: SENT
                    metadata:
                      orderId: ORD1790003079887
                      amount: 627
                      currency: GBP
                    messageId: 01000192...
                    sentAt: "2026-09-21T15:04:55.130Z"
                    createdAt: "2026-09-21T15:04:55.130Z"
                    updatedAt: "2026-09-21T15:04:56.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Notifications]
      summary: Create a notification manually
      description: |
        Creates a PENDING notification. It is emitted on the live SSE bus
        but **not** emailed — call `POST /{id}/send` to trigger delivery.
      operationId: createNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
            example:
              customerId: 3153cd9a-e0e1-7052-ad0c-0af989d0ff51
              type: PAYMENT_COMPLETED
              channel: EMAIL
              message: Your order has been confirmed.
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notification"
        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: customerId, type, channel and message are required
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Live SSE stream — MUST be documented before /{notificationId} in Express
  # ---------------------------------------------------------------------------

  /api/v1/notifications/stream:
    get:
      tags: [Stream]
      summary: Live notification stream (Server-Sent Events)
      description: |
        Opens a long-lived SSE connection for a single customer.

        **Events emitted:**
        - `notification` — a new notification was created for this customer
        - `updated` — an existing notification's status changed (e.g. PENDING → SENT, or READ)
        - Default heartbeat comment `: ping` every 25 seconds

        **Event payload:** JSON-serialised notification object on the `data:` line.

        **Usage from browser:**
        ```js
        const es = new EventSource(
          "http://localhost:3006/api/v1/notifications/stream?customerId=<sub>"
        );
        es.addEventListener("notification", (e) => {
          const n = JSON.parse(e.data);
          // append to UI / bump badge
        });
        es.addEventListener("updated", (e) => {
          const n = JSON.parse(e.data);
          // patch existing item by n.notificationId
        });